# ============================================
# MotoGo Frontend — CI Pipeline
# ============================================
# Ejecuta: Build, Tests y SonarCloud
# Trigger: Push a main, develop y Pull Requests

name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

# Evitar ejecuciones duplicadas en PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: 📊 SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones disabled for SonarCloud

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: "stable"

      - name: 📦 Instalar dependencias
        run: flutter pub get

      - name: 🧪 Tests con cobertura
        run: flutter test --coverage

      - name: 🔎 SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
