# ============================================
# SonarCloud Configuration - MotoGo Frontend
# ============================================

# Identificación del proyecto (confirmado de SonarCloud)
sonar.projectKey=EstebanGitPro_motogo_frontend
sonar.organization=estebangitpro

# Metadata
sonar.projectName=MotoGo Frontend
sonar.projectVersion=1.0.0

# Fuentes — Dart/Flutter
sonar.sources=lib
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/*.mocks.dart

# Tests
sonar.tests=test
sonar.test.inclusions=**/*_test.dart

# Cobertura — lcov generado por flutter test --coverage
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/*.mocks.dart
sonar.dart.coverage.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Calidad
sonar.qualitygate.wait=true
