# ============================================
# SonarCloud Configuration - MotoGo Frontend
# ============================================

# Identificación del proyecto (confirmado de SonarCloud)
sonar.projectKey=EstebanGitPro_motogo_frontend
sonar.organization=estebangitpro

# Metadata
sonar.projectName=MotoGo Frontend
sonar.projectVersion=0.13.0

# Fuentes — Dart/Flutter
sonar.sources=lib
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/*.mocks.dart

# Tests
sonar.tests=test
sonar.test.inclusions=**/*_test.dart

# Cobertura — lcov generado por flutter test --coverage
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/*.mocks.dart,**/presentation/**,**/core/widgets/**,**/core/injector/**,**/core/services/**
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Duplicación — Exclusiones CPD (Copy-Paste Detector)
# Los contratos abstractos de repository/datasource son mirrors inherentes a Clean Architecture
sonar.cpd.exclusions=**/domain/repositories/**,**/data/datasources/**

# Calidad
sonar.qualitygate.wait=true
