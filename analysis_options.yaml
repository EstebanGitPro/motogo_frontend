# Flutter/Dart Analysis Options
# Configuración balanceada - Mejores prácticas sin ser demasiado estricto
# Documentación: https://dart.dev/tools/analysis

# Usar las reglas recomendadas de Flutter como base
include: package:flutter_lints/flutter.yaml

analyzer:
  # Severidad de errores
  errors:
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning
  
  # Excluir archivos generados automáticamente
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/generated/**"
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    # =========================================================================
    # SEGURIDAD Y ERRORES CRÍTICOS (Siempre activados)
    # =========================================================================
    avoid_print: true                          # No usar print() en producción
    avoid_empty_else: true                     # No dejar else vacíos
    avoid_returning_null_for_future: true      # Future nunca debe retornar null
    avoid_slow_async_io: true                  # Evitar IO síncrono lento
    cancel_subscriptions: true                 # Cancelar suscripciones
    close_sinks: true                          # Cerrar sinks
    no_duplicate_case_values: true             # Sin duplicados en switch
    throw_in_finally: true                     # No lanzar en finally
    valid_regexps: true                        # Regex válidos
    
    # =========================================================================
    # CÓDIGO LIMPIO (Muy recomendados)
    # =========================================================================
    always_declare_return_types: true          # Siempre declarar tipos de retorno
    annotate_overrides: true                   # Usar @override siempre
    avoid_init_to_null: true                   # No inicializar a null
    avoid_null_checks_in_equality_operators: true
    avoid_return_types_on_setters: true        # Sin tipos de retorno en setters
    avoid_shadowing_type_parameters: true
    avoid_unnecessary_containers: true         # Sin containers innecesarios
    await_only_futures: true                   # Solo await en Futures
    camel_case_extensions: true
    camel_case_types: true
    constant_identifier_names: true            # SCREAMING_CAPS para constants
    curly_braces_in_flow_control_structures: true
    directives_ordering: true                  # Ordenar imports
    empty_catches: true                        # No catch vacíos
    empty_constructor_bodies: true
    empty_statements: true
    file_names: true                           # snake_case en archivos
    hash_and_equals: true
    implementation_imports: true
    library_names: true
    library_prefixes: true
    non_constant_identifier_names: true
    null_closures: true
    only_throw_errors: true
    overridden_fields: true
    prefer_adjacent_string_concatenation: true
    prefer_collection_literals: true
    prefer_conditional_assignment: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_contains: true
    prefer_final_fields: true
    prefer_for_elements_to_map_fromIterable: true
    prefer_function_declarations_over_variables: true
    prefer_generic_function_type_aliases: true
    prefer_if_null_operators: true
    prefer_initializing_formals: true
    prefer_interpolation_to_compose_strings: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    prefer_is_not_operator: true
    prefer_iterable_whereType: true
    prefer_null_aware_operators: true
    prefer_single_quotes: true                 # Comillas simples
    prefer_spread_collections: true
    prefer_void_to_null: true
    provide_deprecation_message: true
    recursive_getters: true
    require_trailing_commas: true              # Trailing commas
    slash_for_doc_comments: true
    type_init_formals: true
    unawaited_futures: true
    unnecessary_brace_in_string_interps: true
    unnecessary_const: true
    unnecessary_constructor_name: true
    unnecessary_getters_setters: true
    unnecessary_late: true
    unnecessary_new: true
    unnecessary_null_aware_assignments: true
    unnecessary_null_in_if_null_operators: true
    unnecessary_overrides: true
    unnecessary_parenthesis: true
    unnecessary_string_escapes: true
    unnecessary_string_interpolations: true
    unnecessary_this: true
    unrelated_type_equality_checks: true
    use_full_hex_values_for_flutter_colors: true
    use_function_type_syntax_for_parameters: true
    use_rethrow_when_possible: true
    use_super_parameters: true
    void_checks: true
    
    # =========================================================================
    # FLUTTER ESPECÍFICO
    # =========================================================================
    use_key_in_widget_constructors: true
    avoid_web_libraries_in_flutter: true
    sized_box_for_whitespace: true
    sized_box_shrink_expand: true
    use_colored_box: true
    use_decorated_box: true
    sort_child_properties_last: true
    use_build_context_synchronously: true
    
    # =========================================================================
    # DESACTIVADOS (Generan demasiado ruido o son muy opinables)
    # =========================================================================
    # Estos están desactivados porque pueden ser contra-productivos
    prefer_final_locals: false                 # final en locales (muy estricto)
    prefer_final_in_for_each: false            # final en for-each
    unnecessary_final: false                   # Permite usar final libremente
    omit_local_variable_types: false           # Permite tipos explícitos
    prefer_expression_function_bodies: false   # Permite bloques {}
    avoid_types_on_closure_parameters: false   # Permite tipos en closures
    sort_constructors_first: false             # Orden de constructores flexible
    lines_longer_than_80_chars: false          # Permite líneas largas
    public_member_api_docs: false              # Docs opcionales
    cascade_invocations: false                 # Cascadas opcionales
    avoid_positional_boolean_parameters: false # Bools posicionales OK
    avoid_catches_without_on_clauses: false    # Catch genérico permitido
    prefer_asserts_with_message: false         # Asserts sin mensaje OK
